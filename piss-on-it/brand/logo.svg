  <rect width="800" height="800" fill="#111111"/>
  <!-- droplet -->
  <path d="M400 110 C400 110 210 360 210 500 C210 610 295 690 400 690 C505 690 590 610 590 500 C590 360 400 110 400 110 Z"
        fill="#FFD60A" stroke="#F8F8F2" stroke-width="14"/>
